<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <rect width="1200" height="630" fill="#080b11"/>
  
  <!-- Subtle Grid Lines -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1a2234" stroke-width="1" opacity="0.4"/>
    </pattern>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>
  
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Brand Icon -->
  <rect x="100" y="140" width="80" height="80" rx="20" fill="url(#blueGrad)"/>
  <path d="M 140 162 L 160 174 L 140 186 L 120 174 Z" fill="none" stroke="#ffffff" stroke-width="4" stroke-linejoin="round"/>
  <path d="M 120 188 L 140 200 L 160 188" fill="none" stroke="#ffffff" stroke-width="4" stroke-linejoin="round"/>
  <path d="M 120 198 L 140 210 L 160 198" fill="none" stroke="#ffffff" stroke-width="4" stroke-linejoin="round"/>

  <!-- Title -->
  <text x="205" y="198" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="52" font-weight="800" letter-spacing="-1">NexusPanel</text>
  <rect x="520" y="165" width="80" height="32" rx="16" fill="#141b2b" stroke="#243048" stroke-width="1"/>
  <text x="560" y="186" fill="#94a3b8" font-family="JetBrains Mono, monospace" font-size="14" font-weight="600" text-anchor="middle">v1.2.0</text>

  <!-- Tagline -->
  <text x="100" y="290" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="44" font-weight="700" letter-spacing="-0.5">Ekran startowy dla Twojego homelabu</text>
  <text x="100" y="348" fill="#60a5fa" font-family="Inter, system-ui, sans-serif" font-size="44" font-weight="700" letter-spacing="-0.5">&amp; 6 natywnych widżetów na Androida</text>

  <!-- Subtext -->
  <text x="100" y="420" fill="#94a3b8" font-family="Inter, system-ui, sans-serif" font-size="22" font-weight="400">Proxmox VE • Docker • Home Assistant • Plex • Skaner LAN • Zero Chmury</text>

  <!-- Badges Footer -->
  <rect x="100" y="480" width="1000" height="60" rx="12" fill="#0e131f" stroke="#1a2234" stroke-width="1"/>
  <text x="130" y="517" fill="#10b981" font-family="JetBrains Mono, monospace" font-size="16" font-weight="600">● Self-Hosted</text>
  <text x="310" y="517" fill="#38bdf8" font-family="JetBrains Mono, monospace" font-size="16" font-weight="600">● Open Source (MIT)</text>
  <text x="560" y="517" fill="#a78bfa" font-family="JetBrains Mono, monospace" font-size="16" font-weight="600">● Proxmox 1-Liner LXC</text>
  <text x="830" y="517" fill="#f59e0b" font-family="JetBrains Mono, monospace" font-size="16" font-weight="600">● github.com/MarauTech/NexusPanel</text>
</svg>
