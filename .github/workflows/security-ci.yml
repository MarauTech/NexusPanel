name: Security & CI Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-security-audit:
    name: Security & Integration Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Build Frontend Assets
        run: npm run build

      - name: Run Automated Security Test Suite
        run: npm run test --workspace=server
        env:
          NODE_ENV: test
          JWT_SECRET: ci-security-test-secret-at-least-32-chars-long!

      - name: Run API Integration Test Suite
        run: npm run test:api --workspace=server
        env:
          NODE_ENV: test
          JWT_SECRET: ci-security-test-secret-at-least-32-chars-long!

      - name: Docker Build Check
        run: docker build -t nexuspanel:ci .
